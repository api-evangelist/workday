meters:
  - name: tenant_subscription
    description: Negotiated annual subscription for the Workday tenant covering HCM, Financial Management, and platform modules included in the contract.
    unit: month
    aggregation: max
    dimensions:
      - tenant
      - module
  - name: workforce_seats
    description: Licensed workforce count used to size the Workday subscription; included in the negotiated price rather than billed as overage.
    unit: seat
    aggregation: max
    dimensions:
      - tenant
      - module
principles:
  - name: Visibility
    description: Treat Workday spend as a contract-level line item; reconcile against signed order forms and renewal worksheets rather than a usage API. Use the Workday tenant audit reports and Tenant Health dashboards to track entitlement consumption (modules deployed, integrations live).
  - name: Allocation
    description: Allocate the Workday subscription across HR, Finance, and IT cost centers based on the modules each function uses; integrations and Extend apps can be tagged at the project level for chargeback against the platform fee.
  - name: Optimization
    description: Optimize at renewal by right-sizing licensed workforce counts, retiring unused modules, consolidating sandbox tenants, and avoiding low-value Extend / Integration Cloud add-ons; tactical optimization at runtime is limited because pricing is not metered.
  - name: Accountability
    description: Designate a Workday HRIS / ERP owner who reviews module utilization quarterly with Workday's Customer Success team and signs off on renewals, true-ups, and add-on SKUs.
