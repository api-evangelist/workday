arazzo: 1.0.1
info:
  title: Workday Okta new worker user provisioning
  summary: Provision an Okta user for a Workday worker
  description: Reads a worker from Workday and creates the matching Okta user with the work email as login, activating it on creation. Mirrors the Workday to Okta pairing listed on Zapier.
  version: 1.0.0
sourceDescriptions:
- name: workdayWorkers
  url: https://raw.githubusercontent.com/api-evangelist/workday/refs/heads/main/openapi/workday-workers-api-openapi.yml
  type: openapi
- name: oktaUser
  url: https://raw.githubusercontent.com/api-evangelist/okta/refs/heads/main/openapi/okta-user-api-openapi.yml
  type: openapi
workflows:
- workflowId: workday-worker-okta-user
  summary: Provision an Okta user for a Workday worker
  description: Reads a worker from Workday and creates the matching Okta user with the work email as login, activating it on creation. Mirrors the Workday to Okta pairing listed on Zapier.
  inputs:
    type: object
    required:
    - workerId
    properties:
      workerId:
        type: string
        description: Workday ID of the worker
  steps:
  - stepId: get-worker
    description: Read the Workday worker record.
    operationId: $sourceDescriptions.workdayWorkers.getWorkerById
    parameters:
    - name: ID
      in: path
      value: $inputs.workerId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      workerId: $response.body#/id
      name: $response.body#/descriptor
      email: $response.body#/primaryWorkEmail
      businessTitle: $response.body#/businessTitle
  - stepId: create-okta-user
    description: Create and activate the Okta user.
    operationId: $sourceDescriptions.oktaUser.createUser
    parameters:
    - name: activate
      in: query
      value: true
    requestBody:
      contentType: application/json
      payload:
        profile:
          login: $steps.get-worker.outputs.email
          email: $steps.get-worker.outputs.email
          title: $steps.get-worker.outputs.businessTitle
          employeeNumber: $steps.get-worker.outputs.workerId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      oktaUserId: $response.body#/id
  outputs:
    oktaUserId: $steps.create-okta-user.outputs.oktaUserId
x-integration:
  partner: okta
  edge_evidence: https://zapier.com/apps/workday/integrations/okta
  edge_type: marketplace
  method: generated
  generated: '2026-10-13'
  generator: claude-opus-5.5 market-workflows
  guessed_steps:
  - step: create-okta-user
    cause: partner-contract
    why: Okta requires profile.firstName/lastName; the Workday Worker schema exposes only a combined descriptor, so the name split is left out and the profile mapping is not settled by either spec
