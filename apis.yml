- type: Features
  url: https://www.workday.com/en-us/products.html
  data:
  - name: Human Capital Management
    description: Comprehensive HCM suite for managing the entire employee lifecycle
      from hiring to retirement with global compliance.
  - name: Financial Management
    description: Cloud-native financial management with real-time accounting, procurement,
      expenses, and revenue management.
  - name: Adaptive Planning
    description: Enterprise planning and budgeting with collaborative forecasting,
      scenario modeling, and rolling forecasts.
  - name: Prism Analytics
    description: Augmented analytics platform combining Workday and third-party data
      for actionable business intelligence.
  - name: Recruiting
    description: End-to-end recruiting solution with job requisitions, candidate management,
      and interview scheduling.
  - name: Talent Management
    description: Skills-based talent optimization with performance reviews, succession
      planning, and career development.
  - name: Payroll
    description: Global payroll processing with automated calculations, tax compliance,
      and pay slip generation.
  - name: Time and Absence Tracking
    description: Automated time entry, timesheet management, leave balances, and absence
      request workflows.
  - name: Workday Extend
    description: Low-code platform for building custom applications that integrate
      natively with the Workday ecosystem.
  - name: Report-as-a-Service
    description: Expose custom Workday reports as RESTful web services for programmatic
      data access and integration.
- type: UseCases
  url: https://www.workday.com/en-us/solutions.html
  data:
  - name: Employee Onboarding
    description: Automate new hire onboarding workflows including position assignment,
      benefits enrollment, and system provisioning.
  - name: Workforce Planning
    description: Model headcount scenarios, track open positions, and align workforce
      supply with business demand.
  - name: Expense Management
    description: Streamline employee expense reporting with automated policy enforcement,
      approval workflows, and reimbursement.
  - name: Compliance Reporting
    description: Generate regulatory compliance reports for labor laws, tax requirements,
      and industry-specific mandates.
  - name: Performance Reviews
    description: Conduct structured performance evaluations with goal tracking, feedback
      collection, and calibration.
  - name: Payroll Integration
    description: Integrate payroll data with third-party systems for tax filing, benefits
      administration, and general ledger posting.
- type: Integrations
  url: https://marketplace.workday.com/en-US/home
  data:
  - name: Salesforce
    description: Sync workforce and customer data between Workday HCM and Salesforce
      CRM for unified employee and customer insights.
  - name: Microsoft 365
    description: Integrate Workday with Microsoft Teams, Outlook, and Azure AD for
      single sign-on and productivity workflows.
  - name: ServiceNow
    description: Connect Workday HR processes with ServiceNow ITSM for automated employee
      service delivery and ticket management.
  - name: Slack
    description: Enable Workday notifications, approvals, and time-off requests directly
      within Slack channels and DMs.
  - name: ADP
    description: Integrate Workday payroll with ADP for third-party payroll processing
      and tax filing services.
  - name: SAP
    description: Connect Workday financial management with SAP ERP for cross-system
      accounting and procurement workflows.
  - name: Greenhouse
    description: Integrate Workday with Greenhouse recruiting for seamless candidate
      pipeline management and hiring workflows.
  - name: Okta
    description: Connect Workday with Okta for identity management, single sign-on,
      and automated user provisioning.
