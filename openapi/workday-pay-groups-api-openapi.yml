openapi: 3.1.0
info:
  title: Workday Payroll Pay Groups API
  description: Payroll API for managing pay groups, pay group details, tax rates, payroll inputs, and pay components.
  version: v1
  contact:
    name: Workday Support
    email: support@workday.com
    url: https://www.workday.com/en-us/customer-service/support.html
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal.html
servers:
- url: https://wd2-impl-services1.workday.com/ccx/api/payroll/v1/{tenant}
  description: Workday REST API Server
  variables:
    tenant:
      default: tenant_name
      description: The Workday tenant identifier
security:
- OAuth2:
  - r_payroll
  - w_payroll
tags:
- name: Pay Groups
  description: Endpoints for managing pay groups and pay periods.
paths:
  /payGroups:
    get:
      operationId: getPayGroups
      summary: Get Pay Groups
      description: Returns a collection of pay groups.
      tags:
      - Pay Groups
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response containing pay groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayGroup'
                  total:
                    type: integer
              examples:
                Getpaygroups200Example:
                  summary: Default getPayGroups 200 response
                  x-microcks-default: true
                  value:
                    data:
                    - id: abc123
                      descriptor: example_value
                      name: Example Title
                      isActive: true
                    total: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /payGroups/{ID}:
    get:
      operationId: getPayGroupById
      summary: Get Pay Group by Id
      description: Returns details for a specific pay group.
      tags:
      - Pay Groups
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response containing pay group details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayGroup'
              examples:
                Getpaygroupbyid200Example:
                  summary: Default getPayGroupById 200 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    descriptor: example_value
                    name: Example Title
                    country:
                      id: abc123
                      descriptor: example_value
                      href: https://www.example.com
                    payFrequency:
                      id: abc123
                      descriptor: example_value
                      href: https://www.example.com
                    currency:
                      id: abc123
                      descriptor: example_value
                      href: https://www.example.com
                    isActive: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /payGroups/{ID}/payGroupDetails:
    get:
      operationId: getPayGroupDetails
      summary: Get Pay Group Details
      description: Returns detailed information for a pay group including pay periods.
      tags:
      - Pay Groups
      parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response containing pay group details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayGroupDetail'
                  total:
                    type: integer
              examples:
                Getpaygroupdetails200Example:
                  summary: Default getPayGroupDetails 200 response
                  x-microcks-default: true
                  value:
                    data:
                    - id: abc123
                      descriptor: example_value
                      payPeriodStartDate: '2026-01-15'
                      payPeriodEndDate: '2026-01-15'
                      payDate: '2026-01-15'
                      payRunStatus: example_value
                    total: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  parameters:
    offset:
      name: offset
      in: query
      required: false
      description: The zero-based index of the first object in a response collection.
      schema:
        type: integer
        default: 0
    limit:
      name: limit
      in: query
      required: false
      description: The maximum number of objects in a single response.
      schema:
        type: integer
        default: 20
        maximum: 100
    ID:
      name: ID
      in: path
      required: true
      description: The Workday ID of the resource.
      schema:
        type: string
  schemas:
    ResourceReference:
      type: object
      properties:
        id:
          type: string
          example: abc123
        descriptor:
          type: string
          example: example_value
        href:
          type: string
          format: uri
          example: https://www.example.com
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: example_value
        errors:
          type: array
          items:
            type: object
            properties:
              error:
                type: string
              field:
                type: string
          example: []
    PayGroupDetail:
      type: object
      properties:
        id:
          type: string
          example: abc123
        descriptor:
          type: string
          example: example_value
        payPeriodStartDate:
          type: string
          format: date
          example: '2026-01-15'
        payPeriodEndDate:
          type: string
          format: date
          example: '2026-01-15'
        payDate:
          type: string
          format: date
          example: '2026-01-15'
        payRunStatus:
          type: string
          example: example_value
    PayGroup:
      type: object
      properties:
        id:
          type: string
          example: abc123
        descriptor:
          type: string
          example: example_value
        name:
          type: string
          example: Example Title
        country:
          $ref: '#/components/schemas/ResourceReference'
        payFrequency:
          $ref: '#/components/schemas/ResourceReference'
        currency:
          $ref: '#/components/schemas/ResourceReference'
        isActive:
          type: boolean
          example: true
  responses:
    Unauthorized:
      description: Authentication credentials were missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://wd2-impl-services1.workday.com/ccx/oauth2/{tenant}/authorize
          tokenUrl: https://wd2-impl-services1.workday.com/ccx/oauth2/{tenant}/token
          scopes:
            r_payroll: Read payroll data
            w_payroll: Write payroll data
