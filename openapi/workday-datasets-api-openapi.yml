openapi: 3.1.0
info:
  title: Workday Prism Analytics Datasets API
  description: Prism Analytics REST API for working with Workday Prism Analytics tables, data change tasks, and datasets. Enables programmatic creation and management of analytics data.
  version: v3
  contact:
    name: Workday Support
    email: support@workday.com
    url: https://www.workday.com/en-us/customer-service/support.html
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal.html
servers:
- url: https://wd2-impl-services1.workday.com/ccx/api/prismAnalytics/v3/{tenant}
  description: Workday REST API Server
  variables:
    tenant:
      default: tenant_name
      description: The Workday tenant identifier
security:
- OAuth2:
  - r_prism
  - w_prism
tags:
- name: Datasets
  description: Endpoints for managing Prism Analytics datasets.
paths:
  /datasets:
    get:
      operationId: getDatasets
      summary: Get Datasets
      description: Returns a collection of Prism Analytics datasets.
      tags:
      - Datasets
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: name
        in: query
        description: Filter datasets by name.
        schema:
          type: string
        example: Example Title
      responses:
        '200':
          description: Successful response containing datasets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dataset'
                  total:
                    type: integer
              examples:
                Getdatasets200Example:
                  summary: Default getDatasets 200 response
                  x-microcks-default: true
                  value:
                    data:
                    - id: abc123
                      descriptor: example_value
                      name: Example Title
                      displayName: example_value
                      description: A sample description.
                      tags:
                      - {}
                      fields:
                      - {}
                      rowCount: 10
                      createdOn: '2026-01-15T10:30:00Z'
                      updatedOn: '2026-01-15T10:30:00Z'
                    total: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createDataset
      summary: Create Dataset
      description: Creates a new Prism Analytics dataset with a specified schema.
      tags:
      - Datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateRequest'
            examples:
              CreatedatasetRequestExample:
                summary: Default createDataset request
                x-microcks-default: true
                value:
                  name: Example Title
                  displayName: example_value
                  description: A sample description.
                  fields:
                  - name: Example Title
                    displayName: example_value
                    ordinal: 10
                    type: {}
                    required: true
                    externalId: '500123'
                  tags:
                  - example_value
      responses:
        '201':
          description: Dataset created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
              examples:
                Createdataset201Example:
                  summary: Default createDataset 201 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    descriptor: example_value
                    name: Example Title
                    displayName: example_value
                    description: A sample description.
                    tags:
                    - example_value
                    fields:
                    - name: Example Title
                      displayName: example_value
                      ordinal: 10
                      type: {}
                      required: true
                      externalId: '500123'
                    rowCount: 10
                    createdOn: '2026-01-15T10:30:00Z'
                    updatedOn: '2026-01-15T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /datasets/{ID}:
    get:
      operationId: getDatasetById
      summary: Get Dataset by Id
      description: Returns detailed information for a specific dataset.
      tags:
      - Datasets
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response containing dataset details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
              examples:
                Getdatasetbyid200Example:
                  summary: Default getDatasetById 200 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    descriptor: example_value
                    name: Example Title
                    displayName: example_value
                    description: A sample description.
                    tags:
                    - example_value
                    fields:
                    - name: Example Title
                      displayName: example_value
                      ordinal: 10
                      type: {}
                      required: true
                      externalId: '500123'
                    rowCount: 10
                    createdOn: '2026-01-15T10:30:00Z'
                    updatedOn: '2026-01-15T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      operationId: updateDataset
      summary: Update Dataset
      description: Updates a dataset schema or metadata.
      tags:
      - Datasets
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetUpdateRequest'
            examples:
              UpdatedatasetRequestExample:
                summary: Default updateDataset request
                x-microcks-default: true
                value:
                  displayName: example_value
                  description: A sample description.
                  fields:
                  - name: Example Title
                    displayName: example_value
                    ordinal: 10
                    type: {}
                    required: true
                    externalId: '500123'
                  tags:
                  - example_value
      responses:
        '200':
          description: Dataset updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
              examples:
                Updatedataset200Example:
                  summary: Default updateDataset 200 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    descriptor: example_value
                    name: Example Title
                    displayName: example_value
                    description: A sample description.
                    tags:
                    - example_value
                    fields:
                    - name: Example Title
                      displayName: example_value
                      ordinal: 10
                      type: {}
                      required: true
                      externalId: '500123'
                    rowCount: 10
                    createdOn: '2026-01-15T10:30:00Z'
                    updatedOn: '2026-01-15T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      operationId: deleteDataset
      summary: Delete Dataset
      description: Deletes a dataset.
      tags:
      - Datasets
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Dataset deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  parameters:
    offset:
      name: offset
      in: query
      required: false
      description: The zero-based index of the first object in a response collection.
      schema:
        type: integer
        default: 0
    ID:
      name: ID
      in: path
      required: true
      description: The Workday ID of the resource.
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      description: The maximum number of objects in a single response.
      schema:
        type: integer
        default: 20
        maximum: 100
  schemas:
    DatasetCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: The name for the new dataset.
          example: Example Title
        displayName:
          type: string
          description: The display name for the dataset.
          example: example_value
        description:
          type: string
          example: A sample description.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DatasetField'
          example: []
        tags:
          type: array
          items:
            type: string
          example: []
      required:
      - name
      - fields
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: example_value
        errors:
          type: array
          items:
            type: object
            properties:
              error:
                type: string
              field:
                type: string
          example: []
    Dataset:
      type: object
      properties:
        id:
          type: string
          description: The Workday ID of the dataset.
          example: abc123
        descriptor:
          type: string
          example: example_value
        name:
          type: string
          description: The name of the dataset.
          example: Example Title
        displayName:
          type: string
          description: The display name of the dataset.
          example: example_value
        description:
          type: string
          example: A sample description.
        tags:
          type: array
          items:
            type: string
          example: []
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DatasetField'
          example: []
        rowCount:
          type: integer
          description: The number of rows in the dataset.
          example: 10
        createdOn:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        updatedOn:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
    DatasetUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          example: example_value
        description:
          type: string
          example: A sample description.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DatasetField'
          example: []
        tags:
          type: array
          items:
            type: string
          example: []
    DatasetField:
      type: object
      properties:
        name:
          type: string
          description: The field name.
          example: Example Title
        displayName:
          type: string
          description: The display name of the field.
          example: example_value
        ordinal:
          type: integer
          description: The ordinal position of the field.
          example: 10
        type:
          type: object
          properties:
            id:
              type: string
            descriptor:
              type: string
          description: The data type of the field.
          example: example_value
        required:
          type: boolean
          example: true
        externalId:
          type: string
          example: '500123'
  responses:
    Unauthorized:
      description: Authentication credentials were missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: The request was invalid or malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://wd2-impl-services1.workday.com/ccx/oauth2/{tenant}/authorize
          tokenUrl: https://wd2-impl-services1.workday.com/ccx/oauth2/{tenant}/token
          scopes:
            r_prism: Read Prism Analytics data
            w_prism: Write Prism Analytics data
