description: Workday sells its HCM, Financial Management, and platform products as enterprise SaaS subscriptions priced per customer; pricing is not published on workday.com and is only quoted through Workday sales. The previous Free / Professional / Enterprise scaffold has been collapsed into a single Contact Sales plan since Workday does not offer self-serve, publicly priced API tiers.
sources:
  - https://www.workday.com/en-us/enterprise-resource-planning.html
notes: Workday's website routes every product page to a Contact Sales call to action; no public per-employee or per-API price is published. Scaffold tiers and TBD overage rates have been removed.
plans:
  - id: workday-contact-sales
    name: Contact Sales
    type: enterprise
    description: All Workday platform access (HCM, Financial Management, Adaptive Planning, Extend, Integration Cloud, Report Writer) is licensed under an enterprise subscription quoted by Workday sales. API access is included with the underlying tenant subscription rather than priced as a separate API plan.
    entries:
      - label: Enterprise Subscription
        name: enterprise_subscription
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: true
    elements:
      - name: Workday Tenant
      - name: REST and SOAP Web Services
      - name: Negotiated SLAs
      - name: Customer Success Engagement
