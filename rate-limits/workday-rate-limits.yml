specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Workday
providerId: workday
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Enterprise Software
  - HCM
  - ERP
  - Rate Limiting
description: Workday tenant APIs (REST and SOAP) are subject to per-tenant transactional and integration concurrency limits that Workday does not publish on its public marketing site; details, including any throttling response codes, are gated behind Workday Community / Customer Center authentication. Numeric limits captured here are intentionally left as references rather than fabricated values.
sources:
  - https://www.workday.com/en-us/enterprise-resource-planning.html
notes: Public marketing pages do not document API rate limits; Workday Community articles describing tenant transaction limits, integration concurrency, and Studio throttling are behind login. Scaffold per-minute / per-month numbers have been removed.
responseCodes: {}
limits:
  - name: Tenant API Throughput
    scope: tenant
    metric: varies
    limit: per-tenant transactional limits documented in Workday Community (login required)
    notes: Workday governs API throughput, integration concurrency, and Studio batch behavior at the tenant level; specific numeric thresholds are not publicly published.
policies:
  - name: Customer Center Documentation
    description: Operational throttling, retry, and integration-failure policies are published in Workday Community / Customer Center articles available to authenticated Workday customers and partners.
  - name: Tenant Isolation
    description: Limits apply per tenant rather than per API key; production and implementation tenants have distinct throughput envelopes.
maintainers:
