naftiko: 1.0.0-alpha2
info:
  label: Workday Time and Absence
  description: Unified time and absence management combining Time Tracking and Absence Management APIs for HR operations to
    manage timesheets, time-off requests, and leave balances.
  tags:
  - Workday
  - Time Tracking
  - Absence Management
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: workday-time-tracking
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/timeTracking
    description: Workday Time Tracking REST API.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: time-tracking
      path: /
      description: Time tracking operations
      operations:
      - name: get-time-clock-events
        method: GET
        description: Returns time clock events for workers.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-time-clock-event
        method: POST
        description: Creates a time clock event.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            type: '{{tools.type}}'
      - name: get-time-entries
        method: GET
        description: Returns time entries.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-timesheets
        method: GET
        description: Returns timesheets.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: request-time-entry
        method: POST
        description: Submits a time entry request.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            hours: '{{tools.hours}}'
  - type: http
    namespace: workday-absence
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/absenceManagement
    description: Workday Absence Management REST API.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: absence
      path: /
      description: Absence management operations
      operations:
      - name: get-eligible-absence-types
        method: GET
        description: Returns eligible absence types for a worker.
        inputParameters:
        - name: worker
          in: query
          type: string
          required: true
          description: Worker ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: request-time-off
        method: POST
        description: Submits a time-off request.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            absenceType: '{{tools.absenceType}}'
            startDate: '{{tools.startDate}}'
      - name: get-time-off-entries
        method: GET
        description: Returns time-off entries.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-time-off-balances
        method: GET
        description: Returns time-off balances for a worker.
        inputParameters:
        - name: worker
          in: query
          type: string
          required: true
          description: Worker ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-leaves-of-absence
        method: GET
        description: Returns leaves of absence.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: request-leave-of-absence
        method: POST
        description: Submits a leave of absence request.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            leaveType: '{{tools.leaveType}}'
  exposes:
  - type: rest
    port: 8083
    namespace: time-absence-api
    description: Unified REST API for time and absence management.
    resources:
    - path: /v1/time-entries
      name: time-entries
      description: Time entries
      operations:
      - method: GET
        name: list-time-entries
        description: List time entries
        call: workday-time-tracking.get-time-entries
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/time-off-balances
      name: balances
      description: Time-off balances
      operations:
      - method: GET
        name: list-balances
        description: List time-off balances
        call: workday-absence.get-time-off-balances
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9083
    namespace: time-absence-mcp
    transport: http
    description: MCP server for AI-assisted time and absence management.
    tools:
    - name: time-list-clock-events
      description: List time clock events
      hints:
        readOnly: true
      call: workday-time-tracking.get-time-clock-events
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: time-create-clock-event
      description: Create a time clock event
      hints:
        readOnly: false
      call: workday-time-tracking.create-time-clock-event
      with:
        worker: tools.worker
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
    - name: time-list-entries
      description: List time entries
      hints:
        readOnly: true
      call: workday-time-tracking.get-time-entries
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: time-list-timesheets
      description: List timesheets
      hints:
        readOnly: true
      call: workday-time-tracking.get-timesheets
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: time-request-entry
      description: Submit a time entry request
      hints:
        readOnly: false
      call: workday-time-tracking.request-time-entry
      with:
        worker: tools.worker
        hours: tools.hours
      outputParameters:
      - type: object
        mapping: $.
    - name: absence-get-eligible-types
      description: Get eligible absence types for a worker
      hints:
        readOnly: true
      call: workday-absence.get-eligible-absence-types
      with:
        worker: tools.worker
      outputParameters:
      - type: object
        mapping: $.
    - name: absence-request-time-off
      description: Submit a time-off request
      hints:
        readOnly: false
      call: workday-absence.request-time-off
      with:
        worker: tools.worker
        absenceType: tools.absenceType
        startDate: tools.startDate
      outputParameters:
      - type: object
        mapping: $.
    - name: absence-list-time-off-entries
      description: List time-off entries
      hints:
        readOnly: true
      call: workday-absence.get-time-off-entries
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: absence-get-balances
      description: Get time-off balances for a worker
      hints:
        readOnly: true
      call: workday-absence.get-time-off-balances
      with:
        worker: tools.worker
      outputParameters:
      - type: object
        mapping: $.
    - name: absence-list-leaves
      description: List leaves of absence
      hints:
        readOnly: true
      call: workday-absence.get-leaves-of-absence
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: absence-request-leave
      description: Submit a leave of absence request
      hints:
        readOnly: false
      call: workday-absence.request-leave-of-absence
      with:
        worker: tools.worker
        leaveType: tools.leaveType
      outputParameters:
      - type: object
        mapping: $.
