naftiko: 1.0.0-alpha2
info:
  label: Workday Talent and Performance
  description: Unified talent and performance management combining Recruiting, Talent, and Performance Management APIs for
    HR and talent leads to manage hiring pipelines, career development, and performance evaluations.
  tags:
  - Workday
  - Talent Management
  - Performance
  - Recruiting
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: workday-recruiting
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/recruiting
    description: Workday Recruiting REST API.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: recruiting
      path: /
      description: Recruiting operations
      operations:
      - name: get-job-requisitions
        method: GET
        description: Returns job requisitions.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-job-requisition-by-id
        method: GET
        description: Returns a job requisition by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Requisition ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-job-postings
        method: GET
        description: Returns job postings.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-job-posting-by-id
        method: GET
        description: Returns a job posting by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Posting ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-candidates
        method: GET
        description: Returns candidates.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-candidate-by-id
        method: GET
        description: Returns a candidate by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Candidate ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-job-applications
        method: GET
        description: Returns job applications.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-job-application-by-id
        method: GET
        description: Returns a job application by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Application ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-prospects
        method: GET
        description: Returns prospects.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: workday-talent
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/talent
    description: Workday Talent Management REST API.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: talent
      path: /
      description: Talent management operations
      operations:
      - name: get-talent-profile
        method: GET
        description: Returns a talent profile for a worker.
        inputParameters:
        - name: worker
          in: query
          type: string
          required: true
          description: Worker ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-mentorships
        method: GET
        description: Returns mentorships.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker-skills
        method: GET
        description: Returns skills for a worker.
        inputParameters:
        - name: worker
          in: query
          type: string
          required: true
          description: Worker ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker-certifications
        method: GET
        description: Returns certifications for a worker.
        inputParameters:
        - name: worker
          in: query
          type: string
          required: true
          description: Worker ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-succession-plans
        method: GET
        description: Returns succession plans.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-succession-plan-by-id
        method: GET
        description: Returns a succession plan by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Succession plan ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: workday-performance
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/performanceManagement
    description: Workday Performance Management REST API.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: performance
      path: /
      description: Performance management operations
      operations:
      - name: get-worker-goals
        method: GET
        description: Returns goals for a worker.
        inputParameters:
        - name: worker
          in: query
          type: string
          required: true
          description: Worker ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-performance-reviews
        method: GET
        description: Returns performance reviews.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-feedback-badges
        method: GET
        description: Returns feedback badges.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: give-feedback-badge
        method: POST
        description: Gives a feedback badge to a worker.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            badge: '{{tools.badge}}'
      - name: request-feedback
        method: POST
        description: Requests feedback for a worker.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            message: '{{tools.message}}'
  exposes:
  - type: rest
    port: 8081
    namespace: talent-performance-api
    description: Unified REST API for talent and performance management.
    resources:
    - path: /v1/job-requisitions
      name: requisitions
      description: Job requisitions
      operations:
      - method: GET
        name: list-requisitions
        description: List job requisitions
        call: workday-recruiting.get-job-requisitions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/candidates
      name: candidates
      description: Candidates
      operations:
      - method: GET
        name: list-candidates
        description: List candidates
        call: workday-recruiting.get-candidates
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/performance-reviews
      name: reviews
      description: Performance reviews
      operations:
      - method: GET
        name: list-reviews
        description: List performance reviews
        call: workday-performance.get-performance-reviews
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/succession-plans
      name: succession
      description: Succession plans
      operations:
      - method: GET
        name: list-succession-plans
        description: List succession plans
        call: workday-talent.get-succession-plans
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9081
    namespace: talent-performance-mcp
    transport: http
    description: MCP server for AI-assisted talent and performance management.
    tools:
    - name: recruiting-list-requisitions
      description: List all job requisitions
      hints:
        readOnly: true
      call: workday-recruiting.get-job-requisitions
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: recruiting-get-requisition
      description: Get a job requisition by ID
      hints:
        readOnly: true
      call: workday-recruiting.get-job-requisition-by-id
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: recruiting-list-postings
      description: List all job postings
      hints:
        readOnly: true
      call: workday-recruiting.get-job-postings
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: recruiting-list-candidates
      description: List all candidates
      hints:
        readOnly: true
      call: workday-recruiting.get-candidates
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: recruiting-get-candidate
      description: Get a candidate by ID
      hints:
        readOnly: true
      call: workday-recruiting.get-candidate-by-id
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: recruiting-list-applications
      description: List all job applications
      hints:
        readOnly: true
      call: workday-recruiting.get-job-applications
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: recruiting-get-application
      description: Get a job application by ID
      hints:
        readOnly: true
      call: workday-recruiting.get-job-application-by-id
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: recruiting-list-prospects
      description: List all prospects
      hints:
        readOnly: true
      call: workday-recruiting.get-prospects
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: talent-get-profile
      description: Get talent profile for a worker
      hints:
        readOnly: true
      call: workday-talent.get-talent-profile
      with:
        worker: tools.worker
      outputParameters:
      - type: object
        mapping: $.
    - name: talent-list-mentorships
      description: List mentorships
      hints:
        readOnly: true
      call: workday-talent.get-mentorships
      outputParameters:
      - type: object
        mapping: $.
    - name: talent-get-skills
      description: Get skills for a worker
      hints:
        readOnly: true
      call: workday-talent.get-worker-skills
      with:
        worker: tools.worker
      outputParameters:
      - type: object
        mapping: $.
    - name: talent-get-certifications
      description: Get certifications for a worker
      hints:
        readOnly: true
      call: workday-talent.get-worker-certifications
      with:
        worker: tools.worker
      outputParameters:
      - type: object
        mapping: $.
    - name: talent-list-succession-plans
      description: List succession plans
      hints:
        readOnly: true
      call: workday-talent.get-succession-plans
      outputParameters:
      - type: object
        mapping: $.
    - name: performance-get-goals
      description: Get goals for a worker
      hints:
        readOnly: true
      call: workday-performance.get-worker-goals
      with:
        worker: tools.worker
      outputParameters:
      - type: object
        mapping: $.
    - name: performance-list-reviews
      description: List performance reviews
      hints:
        readOnly: true
      call: workday-performance.get-performance-reviews
      outputParameters:
      - type: object
        mapping: $.
    - name: performance-list-badges
      description: List feedback badges
      hints:
        readOnly: true
      call: workday-performance.get-feedback-badges
      outputParameters:
      - type: object
        mapping: $.
    - name: performance-give-badge
      description: Give a feedback badge to a worker
      hints:
        readOnly: false
      call: workday-performance.give-feedback-badge
      with:
        worker: tools.worker
        badge: tools.badge
      outputParameters:
      - type: object
        mapping: $.
    - name: performance-request-feedback
      description: Request feedback for a worker
      hints:
        readOnly: false
      call: workday-performance.request-feedback
      with:
        worker: tools.worker
        message: tools.message
      outputParameters:
      - type: object
        mapping: $.
