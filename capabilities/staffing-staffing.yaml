        destructive: false
        idempotent: false
      call: staffing-staffing.requestonetimepayment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: terminate-worker
      description: Terminate Worker
      hints:
        readOnly: false
