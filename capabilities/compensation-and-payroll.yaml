naftiko: 1.0.0-alpha2
info:
  label: Workday Compensation and Payroll
  description: Unified compensation and payroll management combining Compensation, Payroll, and Benefits APIs for payroll
    administrators to manage pay plans, benefits enrollment, and payroll processing.
  tags:
  - Workday
  - Compensation
  - Payroll
  - Benefits
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: workday-compensation
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/compensation
    description: Workday Compensation REST API.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: compensation
      path: /
      description: Compensation operations
      operations:
      - name: get-compensation-plans
        method: GET
        description: Returns compensation plans.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: request-compensation-change
        method: POST
        description: Submits a compensation change request.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            proposedCompensation: '{{tools.proposedCompensation}}'
      - name: get-compensation-scorecards
        method: GET
        description: Returns compensation scorecards.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-compensation-scorecard-by-id
        method: GET
        description: Returns a compensation scorecard by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Scorecard ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-compensation-scorecard-results
        method: GET
        description: Returns scorecard results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: request-one-time-payment
        method: POST
        description: Requests a one-time payment.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            amount: '{{tools.amount}}'
      - name: get-compensation-grades
        method: GET
        description: Returns compensation grades.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: workday-payroll
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/payroll
    description: Workday Payroll REST API.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: payroll
      path: /
      description: Payroll operations
      operations:
      - name: get-pay-groups
        method: GET
        description: Returns pay groups.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-pay-group-by-id
        method: GET
        description: Returns a pay group by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Pay group ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-pay-group-details
        method: GET
        description: Returns pay group details.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Pay group ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-payroll-inputs
        method: GET
        description: Returns payroll inputs.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-pay-slips
        method: GET
        description: Returns pay slips.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: workday-benefits
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/benefits
    description: Workday Benefits REST API.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: benefits
      path: /
      description: Benefits operations
      operations:
      - name: get-benefit-elections
        method: GET
        description: Returns benefit elections for workers.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-eligible-benefit-plans
        method: GET
        description: Returns eligible benefit plans for a worker.
        inputParameters:
        - name: worker
          in: query
          type: string
          required: true
          description: Worker ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-dependents
        method: GET
        description: Returns dependents for a worker.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: change-benefits
        method: POST
        description: Submits a benefits change request.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            benefitPlan: '{{tools.benefitPlan}}'
      - name: get-benefit-plans
        method: GET
        description: Returns available benefit plans.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8082
    namespace: compensation-payroll-api
    description: Unified REST API for compensation, payroll, and benefits.
    resources:
    - path: /v1/compensation-plans
      name: compensation-plans
      description: Compensation plans
      operations:
      - method: GET
        name: list-plans
        description: List compensation plans
        call: workday-compensation.get-compensation-plans
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pay-groups
      name: pay-groups
      description: Pay groups
      operations:
      - method: GET
        name: list-pay-groups
        description: List pay groups
        call: workday-payroll.get-pay-groups
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/benefit-plans
      name: benefit-plans
      description: Benefit plans
      operations:
      - method: GET
        name: list-benefit-plans
        description: List benefit plans
        call: workday-benefits.get-benefit-plans
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9082
    namespace: compensation-payroll-mcp
    transport: http
    description: MCP server for AI-assisted compensation and payroll management.
    tools:
    - name: comp-list-plans
      description: List compensation plans
      hints:
        readOnly: true
      call: workday-compensation.get-compensation-plans
      outputParameters:
      - type: object
        mapping: $.
    - name: comp-request-change
      description: Submit a compensation change request
      hints:
        readOnly: false
      call: workday-compensation.request-compensation-change
      with:
        worker: tools.worker
        proposedCompensation: tools.proposedCompensation
      outputParameters:
      - type: object
        mapping: $.
    - name: comp-list-scorecards
      description: List compensation scorecards
      hints:
        readOnly: true
      call: workday-compensation.get-compensation-scorecards
      outputParameters:
      - type: object
        mapping: $.
    - name: comp-list-grades
      description: List compensation grades
      hints:
        readOnly: true
      call: workday-compensation.get-compensation-grades
      outputParameters:
      - type: object
        mapping: $.
    - name: comp-request-one-time-payment
      description: Request a one-time payment
      hints:
        readOnly: false
      call: workday-compensation.request-one-time-payment
      with:
        worker: tools.worker
        amount: tools.amount
      outputParameters:
      - type: object
        mapping: $.
    - name: payroll-list-pay-groups
      description: List all pay groups
      hints:
        readOnly: true
      call: workday-payroll.get-pay-groups
      outputParameters:
      - type: object
        mapping: $.
    - name: payroll-get-pay-group
      description: Get a pay group by ID
      hints:
        readOnly: true
      call: workday-payroll.get-pay-group-by-id
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: payroll-get-pay-group-details
      description: Get pay group details
      hints:
        readOnly: true
      call: workday-payroll.get-pay-group-details
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: payroll-list-inputs
      description: List payroll inputs
      hints:
        readOnly: true
      call: workday-payroll.get-payroll-inputs
      outputParameters:
      - type: object
        mapping: $.
    - name: payroll-list-pay-slips
      description: List pay slips
      hints:
        readOnly: true
      call: workday-payroll.get-pay-slips
      outputParameters:
      - type: object
        mapping: $.
    - name: benefits-list-elections
      description: List benefit elections
      hints:
        readOnly: true
      call: workday-benefits.get-benefit-elections
      outputParameters:
      - type: object
        mapping: $.
    - name: benefits-get-eligible-plans
      description: Get eligible benefit plans for a worker
      hints:
        readOnly: true
      call: workday-benefits.get-eligible-benefit-plans
      with:
        worker: tools.worker
      outputParameters:
      - type: object
        mapping: $.
    - name: benefits-list-dependents
      description: List dependents
      hints:
        readOnly: true
      call: workday-benefits.get-dependents
      outputParameters:
      - type: object
        mapping: $.
    - name: benefits-change
      description: Submit a benefits change request
      hints:
        readOnly: false
      call: workday-benefits.change-benefits
      with:
        worker: tools.worker
        benefitPlan: tools.benefitPlan
      outputParameters:
      - type: object
        mapping: $.
    - name: benefits-list-plans
      description: List all benefit plans
      hints:
        readOnly: true
      call: workday-benefits.get-benefit-plans
      outputParameters:
      - type: object
        mapping: $.
