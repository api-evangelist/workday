naftiko: 1.0.0-alpha2
info:
  label: Workday Workforce Management
  description: Unified workforce management combining HCM, Person, Staffing, and Common APIs for HR administrators to manage
    workers, organizations, positions, and reference data.
  tags:
  - Workday
  - Workforce Management
  - Human Resources
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: workday-hcm
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}
    description: Workday HCM REST API for core HR operations.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: workers
      path: /workers
      description: Worker data management
      operations:
      - name: get-workers
        method: GET
        description: Returns a collection of workers with filtering and pagination.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results to return.
        - name: offset
          in: query
          type: integer
          required: false
          description: Number of results to skip.
        - name: search
          in: query
          type: string
          required: false
          description: Search term for filtering workers.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker-by-id
        method: GET
        description: Returns a single worker by their unique identifier.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: The unique identifier of the worker.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker-history
        method: GET
        description: Returns the history of changes for a specific worker.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: The unique identifier of the worker.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker-photo
        method: GET
        description: Returns the photo for a specific worker.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: The unique identifier of the worker.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker-business-title-changes
        method: GET
        description: Returns business title changes for a specific worker.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: The unique identifier of the worker.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker-inbox-tasks
        method: GET
        description: Returns inbox tasks for a specific worker.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: The unique identifier of the worker.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: organizations
      path: /supervisoryOrganizations
      description: Supervisory organization management
      operations:
      - name: get-supervisory-organizations
        method: GET
        description: Returns a collection of supervisory organizations.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results.
        - name: offset
          in: query
          type: integer
          required: false
          description: Number of results to skip.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-supervisory-organization-by-id
        method: GET
        description: Returns a single supervisory organization by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: The unique identifier of the organization.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: locations
      path: /locations
      description: Location management
      operations:
      - name: get-locations
        method: GET
        description: Returns a collection of locations.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-location-by-id
        method: GET
        description: Returns a single location by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: The unique identifier of the location.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: workday-person
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/person
    description: Workday Person REST API for personal data management.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: people
      path: /
      description: Person data management
      operations:
      - name: get-people
        method: GET
        description: Returns a collection of people.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-person-by-id
        method: GET
        description: Returns a single person by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Person identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-home-contact-information
        method: GET
        description: Returns home contact information for a person.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Person identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-work-contact-information
        method: GET
        description: Returns work contact information for a person.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Person identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-personal-information
        method: GET
        description: Returns personal information for a person.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Person identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: workday-staffing
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/staffing
    description: Workday Staffing REST API.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: staffing
      path: /
      description: Staffing operations
      operations:
      - name: get-organization-assignments
        method: GET
        description: Returns organization assignments for workers.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-job-change
        method: POST
        description: Creates a job change request for a worker.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            proposedJob: '{{tools.proposedJob}}'
      - name: get-job-profiles
        method: GET
        description: Returns a collection of job profiles.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-job-profile-by-id
        method: GET
        description: Returns a job profile by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Job profile ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-positions
        method: GET
        description: Returns a collection of positions.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-position-by-id
        method: GET
        description: Returns a position by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Position ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: request-one-time-payment
        method: POST
        description: Request a one-time payment for a worker.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            amount: '{{tools.amount}}'
      - name: terminate-worker
        method: POST
        description: Initiate a worker termination.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            worker: '{{tools.worker}}'
            terminationDate: '{{tools.terminationDate}}'
  - type: http
    namespace: workday-common
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/common
    description: Workday Common REST API for reference data.
    authentication:
      type: bearer
      token: '{{WORKDAY_OAUTH_TOKEN}}'
    resources:
    - name: reference-data
      path: /
      description: Common reference data
      operations:
      - name: get-countries
        method: GET
        description: Returns a collection of countries.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-country-by-id
        method: GET
        description: Returns a country by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Country ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-currencies
        method: GET
        description: Returns a collection of currencies.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-currency-by-id
        method: GET
        description: Returns a currency by ID.
        inputParameters:
        - name: ID
          in: path
          type: string
          required: true
          description: Currency ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-languages
        method: GET
        description: Returns a collection of languages.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-genders
        method: GET
        description: Returns gender reference values.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-marital-statuses
        method: GET
        description: Returns marital status reference values.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: workforce-management-api
    description: Unified REST API for workforce management operations.
    resources:
    - path: /v1/workers
      name: workers
      description: Worker management
      operations:
      - method: GET
        name: list-workers
        description: List all workers
        call: workday-hcm.get-workers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/workers/{id}
      name: worker-detail
      description: Worker detail
      operations:
      - method: GET
        name: get-worker
        description: Get a worker by ID
        call: workday-hcm.get-worker-by-id
        with:
          ID: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/people
      name: people
      description: Person data
      operations:
      - method: GET
        name: list-people
        description: List all people
        call: workday-person.get-people
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/positions
      name: positions
      description: Position management
      operations:
      - method: GET
        name: list-positions
        description: List all positions
        call: workday-staffing.get-positions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/organizations
      name: organizations
      description: Supervisory organizations
      operations:
      - method: GET
        name: list-organizations
        description: List supervisory organizations
        call: workday-hcm.get-supervisory-organizations
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/countries
      name: countries
      description: Country reference data
      operations:
      - method: GET
        name: list-countries
        description: List all countries
        call: workday-common.get-countries
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: workforce-management-mcp
    transport: http
    description: MCP server for AI-assisted workforce management.
    tools:
    - name: hcm-list-workers
      description: List all workers with optional search and pagination
      hints:
        readOnly: true
        openWorld: true
      call: workday-hcm.get-workers
      with:
        limit: tools.limit
        offset: tools.offset
        search: tools.search
      outputParameters:
      - type: object
        mapping: $.
    - name: hcm-get-worker
      description: Get a specific worker by ID
      hints:
        readOnly: true
      call: workday-hcm.get-worker-by-id
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: hcm-get-worker-history
      description: Get change history for a worker
      hints:
        readOnly: true
      call: workday-hcm.get-worker-history
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: hcm-get-worker-inbox-tasks
      description: Get inbox tasks for a worker
      hints:
        readOnly: true
      call: workday-hcm.get-worker-inbox-tasks
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: hcm-list-organizations
      description: List supervisory organizations
      hints:
        readOnly: true
      call: workday-hcm.get-supervisory-organizations
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: hcm-list-locations
      description: List all locations
      hints:
        readOnly: true
      call: workday-hcm.get-locations
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: person-list-people
      description: List all people
      hints:
        readOnly: true
      call: workday-person.get-people
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: person-get-person
      description: Get a person by ID
      hints:
        readOnly: true
      call: workday-person.get-person-by-id
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: person-get-home-contact
      description: Get home contact information
      hints:
        readOnly: true
      call: workday-person.get-home-contact-information
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: person-get-work-contact
      description: Get work contact information
      hints:
        readOnly: true
      call: workday-person.get-work-contact-information
      with:
        ID: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: staffing-list-positions
      description: List all positions
      hints:
        readOnly: true
      call: workday-staffing.get-positions
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: staffing-list-job-profiles
      description: List all job profiles
      hints:
        readOnly: true
      call: workday-staffing.get-job-profiles
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: staffing-create-job-change
      description: Create a job change request
      hints:
        readOnly: false
      call: workday-staffing.create-job-change
      with:
        worker: tools.worker
        proposedJob: tools.proposedJob
      outputParameters:
      - type: object
        mapping: $.
    - name: staffing-terminate-worker
      description: Initiate a worker termination
      hints:
        readOnly: false
        destructive: true
      call: workday-staffing.terminate-worker
      with:
        worker: tools.worker
        terminationDate: tools.terminationDate
      outputParameters:
      - type: object
        mapping: $.
    - name: common-list-countries
      description: List all countries
      hints:
        readOnly: true
      call: workday-common.get-countries
      outputParameters:
      - type: object
        mapping: $.
    - name: common-list-currencies
      description: List all currencies
      hints:
        readOnly: true
      call: workday-common.get-currencies
      outputParameters:
      - type: object
        mapping: $.
