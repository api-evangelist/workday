      token: '{{env.WORKDAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: recruiting-job-requisitions-rest
    port: 8080
    description: REST adapter for Workday Recruiting API — Job Requisitions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/jobrequisitions
      name: jobrequisitions
      description: REST surface for jobRequisitions.
      operations:
      - method: GET
        name: getjobrequisitions
        description: Get Job Requisitions
        call: recruiting-job-requisitions.getjobrequisitions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobrequisitions/{id}
      name: jobrequisitions-id
      description: REST surface for jobRequisitions-ID.
      operations:
      - method: GET
        name: getjobrequisitionbyid
        description: Get Job Requisition by Id
        call: recruiting-job-requisitions.getjobrequisitionbyid
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: recruiting-job-requisitions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Recruiting API — Job Requisitions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-job-requisitions
      description: Get Job Requisitions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: recruiting-job-requisitions.getjobrequisitions
      outputParameters:
      - type: object
        mapping: $.
    - name: get-job-requisition-id
      description: Get Job Requisition by Id
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: recruiting-job-requisitions.getjobrequisitionbyid
      outputParameters:
      - type: object
        mapping: $.
