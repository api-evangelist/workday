    description: Workday Recruiting API — Job Requisitions business capability. Self-contained, no shared references.
    resources:
    - name: jobRequisitions
      path: /jobRequisitions
      operations:
      - name: getjobrequisitions
        method: GET
        description: Get Job Requisitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: jobRequisitions-ID
      path: /jobRequisitions/{ID}
      operations:
      - name: getjobrequisitionbyid
        method: GET
        description: Get Job Requisition by Id
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
