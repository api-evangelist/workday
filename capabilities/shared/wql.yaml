naftiko: "1.0.0-alpha1"
info:
  label: "Workday WQL"
  description: "Workday Query Language API for SQL-like querying of Workday data and data source discovery."
  tags:
    - Workday
    - Query Language
    - Analytics
  created: "2026-04-18"
  modified: "2026-04-18"
binds:
  - namespace: env
    keys:
      WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: workday-wql
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/wql
      description: "Workday WQL REST API."
      authentication:
        type: bearer
        token: "{{WORKDAY_OAUTH_TOKEN}}"
      resources:
        - name: wql
          path: /
          description: "WQL query operations"
          operations:
            - name: execute-wql-query
              method: POST
              description: "Executes a WQL query."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  query: "{{tools.query}}"
            - name: get-data-sources
              method: GET
              description: "Returns available data sources."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-data-source-by-id
              method: GET
              description: "Returns a data source by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Data source ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-data-source-fields
              method: GET
              description: "Returns fields for a data source."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Data source ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
  exposes:
    - type: rest
      port: 8114
      namespace: workday-wql-api
      resources:
        - path: /v1/wql-query
          name: query
          description: "WQL query endpoint"
          operations:
            - method: POST
              name: execute-query
              description: "Execute a WQL query"
              call: "workday-wql.execute-wql-query"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9114
      namespace: workday-wql-mcp
      transport: http
      tools:
        - name: execute-wql-query
          description: "Execute a WQL query against Workday data"
          hints:
            readOnly: true
          call: "workday-wql.execute-wql-query"
          with:
            query: "tools.query"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-data-sources
          description: "List available WQL data sources"
          hints:
            readOnly: true
          call: "workday-wql.get-data-sources"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-data-source
          description: "Get a data source by ID"
          hints:
            readOnly: true
          call: "workday-wql.get-data-source-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-data-source-fields
          description: "Get fields for a data source"
          hints:
            readOnly: true
          call: "workday-wql.get-data-source-fields"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
