naftiko: "1.0.0-alpha1"
info:
  label: "Workday Recruiting"
  description: "Recruiting API for job postings, candidates, applications, and hiring workflows."
  tags:
    - Workday
    - Recruiting
    - Hiring
  created: "2026-04-18"
  modified: "2026-04-18"
binds:
  - namespace: env
    keys:
      WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: workday-recruiting
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/recruiting
      description: "Workday Recruiting REST API."
      authentication:
        type: bearer
        token: "{{WORKDAY_OAUTH_TOKEN}}"
      resources:
        - name: recruiting
          path: /
          description: "Recruiting operations"
          operations:
            - name: get-job-requisitions
              method: GET
              description: "Returns job requisitions."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-job-requisition-by-id
              method: GET
              description: "Returns a job requisition by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Requisition ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-job-postings
              method: GET
              description: "Returns job postings."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-job-posting-by-id
              method: GET
              description: "Returns a job posting by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Posting ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-candidates
              method: GET
              description: "Returns candidates."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-candidate-by-id
              method: GET
              description: "Returns a candidate by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Candidate ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-job-applications
              method: GET
              description: "Returns job applications."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-job-application-by-id
              method: GET
              description: "Returns a job application by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Application ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-prospects
              method: GET
              description: "Returns prospects."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
  exposes:
    - type: rest
      port: 8104
      namespace: workday-recruiting-api
      resources:
        - path: /v1/job-requisitions
          name: requisitions
          description: "Job requisition endpoints"
          operations:
            - method: GET
              name: list-requisitions
              description: "List job requisitions"
              call: "workday-recruiting.get-job-requisitions"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9104
      namespace: workday-recruiting-mcp
      transport: http
      tools:
        - name: list-job-requisitions
          description: "List all job requisitions"
          hints:
            readOnly: true
          call: "workday-recruiting.get-job-requisitions"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-job-requisition
          description: "Get a job requisition by ID"
          hints:
            readOnly: true
          call: "workday-recruiting.get-job-requisition-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-job-postings
          description: "List all job postings"
          hints:
            readOnly: true
          call: "workday-recruiting.get-job-postings"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-candidates
          description: "List all candidates"
          hints:
            readOnly: true
          call: "workday-recruiting.get-candidates"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-candidate
          description: "Get a candidate by ID"
          hints:
            readOnly: true
          call: "workday-recruiting.get-candidate-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-job-applications
          description: "List all job applications"
          hints:
            readOnly: true
          call: "workday-recruiting.get-job-applications"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-job-application
          description: "Get a job application by ID"
          hints:
            readOnly: true
          call: "workday-recruiting.get-job-application-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-prospects
          description: "List all prospects"
          hints:
            readOnly: true
          call: "workday-recruiting.get-prospects"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
