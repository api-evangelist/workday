naftiko: "1.0.0-alpha1"
info:
  label: "Workday Payroll"
  description: "Payroll API for managing pay groups, payroll inputs, and pay slips."
  tags:
    - Workday
    - Payroll
    - Pay Groups
  created: "2026-04-18"
  modified: "2026-04-18"
binds:
  - namespace: env
    keys:
      WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: workday-payroll
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/payroll
      description: "Workday Payroll REST API."
      authentication:
        type: bearer
        token: "{{WORKDAY_OAUTH_TOKEN}}"
      resources:
        - name: payroll
          path: /
          description: "Payroll operations"
          operations:
            - name: get-pay-groups
              method: GET
              description: "Returns pay groups."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-pay-group-by-id
              method: GET
              description: "Returns a pay group by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Pay group ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-pay-group-details
              method: GET
              description: "Returns pay group details."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Pay group ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-payroll-inputs
              method: GET
              description: "Returns payroll inputs."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-pay-slips
              method: GET
              description: "Returns pay slips."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
  exposes:
    - type: rest
      port: 8109
      namespace: workday-payroll-api
      resources:
        - path: /v1/pay-groups
          name: pay-groups
          description: "Pay group endpoints"
          operations:
            - method: GET
              name: list-pay-groups
              description: "List pay groups"
              call: "workday-payroll.get-pay-groups"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9109
      namespace: workday-payroll-mcp
      transport: http
      tools:
        - name: list-pay-groups
          description: "List all pay groups"
          hints:
            readOnly: true
          call: "workday-payroll.get-pay-groups"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-pay-group
          description: "Get a pay group by ID"
          hints:
            readOnly: true
          call: "workday-payroll.get-pay-group-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-pay-group-details
          description: "Get pay group details"
          hints:
            readOnly: true
          call: "workday-payroll.get-pay-group-details"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-payroll-inputs
          description: "List payroll inputs"
          hints:
            readOnly: true
          call: "workday-payroll.get-payroll-inputs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-pay-slips
          description: "List pay slips"
          hints:
            readOnly: true
          call: "workday-payroll.get-pay-slips"
          outputParameters:
            - type: object
              mapping: "$."
