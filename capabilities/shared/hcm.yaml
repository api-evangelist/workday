naftiko: "1.0.0-alpha1"

info:
  label: "Workday HCM"
  description: "Human Capital Management API for managing workforce data, organizations, locations, and worker lifecycle events."
  tags:
    - Workday
    - Human Capital Management
    - Workforce
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: workday-hcm
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}
      description: "Workday HCM REST API for core HR operations."
      authentication:
        type: bearer
        token: "{{WORKDAY_OAUTH_TOKEN}}"
      resources:
        - name: workers
          path: /workers
          description: "Worker data management"
          operations:
            - name: get-workers
              method: GET
              description: "Returns a collection of workers with filtering and pagination."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of results to return."
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Number of results to skip."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search term for filtering workers."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker-by-id
              method: GET
              description: "Returns a single worker by their unique identifier."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the worker."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker-history
              method: GET
              description: "Returns the history of changes for a specific worker."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the worker."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker-photo
              method: GET
              description: "Returns the photo for a specific worker."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the worker."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker-business-title-changes
              method: GET
              description: "Returns business title changes for a specific worker."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the worker."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker-inbox-tasks
              method: GET
              description: "Returns inbox tasks for a specific worker."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the worker."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: organizations
          path: /supervisoryOrganizations
          description: "Supervisory organization management"
          operations:
            - name: get-supervisory-organizations
              method: GET
              description: "Returns a collection of supervisory organizations."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of results."
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Number of results to skip."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-supervisory-organization-by-id
              method: GET
              description: "Returns a single supervisory organization by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the organization."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: locations
          path: /locations
          description: "Location management"
          operations:
            - name: get-locations
              method: GET
              description: "Returns a collection of locations."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-location-by-id
              method: GET
              description: "Returns a single location by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the location."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: workday-hcm-api
      resources:
        - path: /v1/workers
          name: workers
          description: "Worker data endpoints"
          operations:
            - method: GET
              name: list-workers
              description: "List all workers"
              call: "workday-hcm.get-workers"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/workers/{id}
          name: worker-detail
          description: "Single worker endpoints"
          operations:
            - method: GET
              name: get-worker
              description: "Get worker by ID"
              call: "workday-hcm.get-worker-by-id"
              with:
                ID: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: workday-hcm-mcp
      transport: http
      tools:
        - name: list-workers
          description: "List all workers with optional search and pagination"
          hints:
            readOnly: true
            openWorld: true
          call: "workday-hcm.get-workers"
          with:
            limit: "tools.limit"
            offset: "tools.offset"
            search: "tools.search"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-worker
          description: "Get a specific worker by ID"
          hints:
            readOnly: true
          call: "workday-hcm.get-worker-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-worker-history
          description: "Get change history for a worker"
          hints:
            readOnly: true
          call: "workday-hcm.get-worker-history"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-worker-inbox-tasks
          description: "Get inbox tasks for a worker"
          hints:
            readOnly: true
          call: "workday-hcm.get-worker-inbox-tasks"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-supervisory-organizations
          description: "List all supervisory organizations"
          hints:
            readOnly: true
            openWorld: true
          call: "workday-hcm.get-supervisory-organizations"
          with:
            limit: "tools.limit"
            offset: "tools.offset"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-supervisory-organization
          description: "Get a supervisory organization by ID"
          hints:
            readOnly: true
          call: "workday-hcm.get-supervisory-organization-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-locations
          description: "List all locations"
          hints:
            readOnly: true
            openWorld: true
          call: "workday-hcm.get-locations"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-location
          description: "Get a location by ID"
          hints:
            readOnly: true
          call: "workday-hcm.get-location-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
