naftiko: "1.0.0-alpha1"
info:
  label: "Workday Absence Management"
  description: "Absence Management API for leave balances, time-off requests, and leaves of absence."
  tags:
    - Workday
    - Absence Management
    - Time Off
  created: "2026-04-18"
  modified: "2026-04-18"
binds:
  - namespace: env
    keys:
      WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: workday-absence
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/absenceManagement
      description: "Workday Absence Management REST API."
      authentication:
        type: bearer
        token: "{{WORKDAY_OAUTH_TOKEN}}"
      resources:
        - name: absence
          path: /
          description: "Absence management operations"
          operations:
            - name: get-eligible-absence-types
              method: GET
              description: "Returns eligible absence types for a worker."
              inputParameters:
                - name: worker
                  in: query
                  type: string
                  required: true
                  description: "Worker ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: request-time-off
              method: POST
              description: "Submits a time-off request."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  worker: "{{tools.worker}}"
                  absenceType: "{{tools.absenceType}}"
                  startDate: "{{tools.startDate}}"
            - name: get-time-off-entries
              method: GET
              description: "Returns time-off entries."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-time-off-balances
              method: GET
              description: "Returns time-off balances for a worker."
              inputParameters:
                - name: worker
                  in: query
                  type: string
                  required: true
                  description: "Worker ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-leaves-of-absence
              method: GET
              description: "Returns leaves of absence."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: request-leave-of-absence
              method: POST
              description: "Submits a leave of absence request."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  worker: "{{tools.worker}}"
                  leaveType: "{{tools.leaveType}}"
  exposes:
    - type: rest
      port: 8106
      namespace: workday-absence-api
      resources:
        - path: /v1/time-off-balances
          name: balances
          description: "Time-off balance endpoints"
          operations:
            - method: GET
              name: list-balances
              description: "List time-off balances"
              call: "workday-absence.get-time-off-balances"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9106
      namespace: workday-absence-mcp
      transport: http
      tools:
        - name: get-eligible-absence-types
          description: "Get eligible absence types for a worker"
          hints:
            readOnly: true
          call: "workday-absence.get-eligible-absence-types"
          with:
            worker: "tools.worker"
          outputParameters:
            - type: object
              mapping: "$."
        - name: request-time-off
          description: "Submit a time-off request"
          hints:
            readOnly: false
          call: "workday-absence.request-time-off"
          with:
            worker: "tools.worker"
            absenceType: "tools.absenceType"
            startDate: "tools.startDate"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-time-off-entries
          description: "List time-off entries"
          hints:
            readOnly: true
          call: "workday-absence.get-time-off-entries"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-time-off-balances
          description: "Get time-off balances for a worker"
          hints:
            readOnly: true
          call: "workday-absence.get-time-off-balances"
          with:
            worker: "tools.worker"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-leaves-of-absence
          description: "List leaves of absence"
          hints:
            readOnly: true
          call: "workday-absence.get-leaves-of-absence"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: request-leave-of-absence
          description: "Submit a leave of absence request"
          hints:
            readOnly: false
          call: "workday-absence.request-leave-of-absence"
          with:
            worker: "tools.worker"
            leaveType: "tools.leaveType"
          outputParameters:
            - type: object
              mapping: "$."
