naftiko: "1.0.0-alpha1"
info:
  label: "Workday Benefits"
  description: "Benefits API for managing employee benefits elections, plans, and dependents."
  tags:
    - Workday
    - Benefits
    - Enrollments
  created: "2026-04-18"
  modified: "2026-04-18"
binds:
  - namespace: env
    keys:
      WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: workday-benefits
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/benefits
      description: "Workday Benefits REST API."
      authentication:
        type: bearer
        token: "{{WORKDAY_OAUTH_TOKEN}}"
      resources:
        - name: benefits
          path: /
          description: "Benefits operations"
          operations:
            - name: get-benefit-elections
              method: GET
              description: "Returns benefit elections for workers."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-eligible-benefit-plans
              method: GET
              description: "Returns eligible benefit plans for a worker."
              inputParameters:
                - name: worker
                  in: query
                  type: string
                  required: true
                  description: "Worker ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-dependents
              method: GET
              description: "Returns dependents for a worker."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: change-benefits
              method: POST
              description: "Submits a benefits change request."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  worker: "{{tools.worker}}"
                  benefitPlan: "{{tools.benefitPlan}}"
            - name: get-benefit-plans
              method: GET
              description: "Returns available benefit plans."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
  exposes:
    - type: rest
      port: 8107
      namespace: workday-benefits-api
      resources:
        - path: /v1/benefit-plans
          name: plans
          description: "Benefit plan endpoints"
          operations:
            - method: GET
              name: list-plans
              description: "List benefit plans"
              call: "workday-benefits.get-benefit-plans"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9107
      namespace: workday-benefits-mcp
      transport: http
      tools:
        - name: list-benefit-elections
          description: "List benefit elections"
          hints:
            readOnly: true
          call: "workday-benefits.get-benefit-elections"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-eligible-benefit-plans
          description: "Get eligible benefit plans for a worker"
          hints:
            readOnly: true
          call: "workday-benefits.get-eligible-benefit-plans"
          with:
            worker: "tools.worker"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-dependents
          description: "List dependents"
          hints:
            readOnly: true
          call: "workday-benefits.get-dependents"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: change-benefits
          description: "Submit a benefits change request"
          hints:
            readOnly: false
          call: "workday-benefits.change-benefits"
          with:
            worker: "tools.worker"
            benefitPlan: "tools.benefitPlan"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-benefit-plans
          description: "List all benefit plans"
          hints:
            readOnly: true
          call: "workday-benefits.get-benefit-plans"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
