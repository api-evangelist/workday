naftiko: "1.0.0-alpha1"
info:
  label: "Workday Staffing"
  description: "Staffing API for managing organizational assignments, job profiles, positions, and worker staffing events."
  tags:
    - Workday
    - Staffing
    - Positions
  created: "2026-04-18"
  modified: "2026-04-18"
binds:
  - namespace: env
    keys:
      WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: workday-staffing
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/staffing
      description: "Workday Staffing REST API."
      authentication:
        type: bearer
        token: "{{WORKDAY_OAUTH_TOKEN}}"
      resources:
        - name: staffing
          path: /
          description: "Staffing operations"
          operations:
            - name: get-organization-assignments
              method: GET
              description: "Returns organization assignments for workers."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-job-change
              method: POST
              description: "Creates a job change request for a worker."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  worker: "{{tools.worker}}"
                  proposedJob: "{{tools.proposedJob}}"
            - name: get-job-profiles
              method: GET
              description: "Returns a collection of job profiles."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-job-profile-by-id
              method: GET
              description: "Returns a job profile by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Job profile ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-positions
              method: GET
              description: "Returns a collection of positions."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-position-by-id
              method: GET
              description: "Returns a position by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Position ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: request-one-time-payment
              method: POST
              description: "Request a one-time payment for a worker."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  worker: "{{tools.worker}}"
                  amount: "{{tools.amount}}"
            - name: terminate-worker
              method: POST
              description: "Initiate a worker termination."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  worker: "{{tools.worker}}"
                  terminationDate: "{{tools.terminationDate}}"
  exposes:
    - type: rest
      port: 8102
      namespace: workday-staffing-api
      resources:
        - path: /v1/positions
          name: positions
          description: "Position endpoints"
          operations:
            - method: GET
              name: list-positions
              description: "List all positions"
              call: "workday-staffing.get-positions"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9102
      namespace: workday-staffing-mcp
      transport: http
      tools:
        - name: list-organization-assignments
          description: "List organization assignments"
          hints:
            readOnly: true
          call: "workday-staffing.get-organization-assignments"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-job-change
          description: "Create a job change request"
          hints:
            readOnly: false
          call: "workday-staffing.create-job-change"
          with:
            worker: "tools.worker"
            proposedJob: "tools.proposedJob"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-job-profiles
          description: "List all job profiles"
          hints:
            readOnly: true
          call: "workday-staffing.get-job-profiles"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-job-profile
          description: "Get a job profile by ID"
          hints:
            readOnly: true
          call: "workday-staffing.get-job-profile-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-positions
          description: "List all positions"
          hints:
            readOnly: true
          call: "workday-staffing.get-positions"
          with:
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-position
          description: "Get a position by ID"
          hints:
            readOnly: true
          call: "workday-staffing.get-position-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: request-one-time-payment
          description: "Request a one-time payment for a worker"
          hints:
            readOnly: false
          call: "workday-staffing.request-one-time-payment"
          with:
            worker: "tools.worker"
            amount: "tools.amount"
          outputParameters:
            - type: object
              mapping: "$."
        - name: terminate-worker
          description: "Initiate a worker termination"
          hints:
            readOnly: false
            destructive: true
          call: "workday-staffing.terminate-worker"
          with:
            worker: "tools.worker"
            terminationDate: "tools.terminationDate"
          outputParameters:
            - type: object
              mapping: "$."
