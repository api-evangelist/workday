naftiko: "1.0.0-alpha1"
info:
  label: "Workday Talent"
  description: "Talent Management API for mentorships, talent profiles, skills, certifications, and succession planning."
  tags:
    - Workday
    - Talent Management
    - Succession Planning
  created: "2026-04-18"
  modified: "2026-04-18"
binds:
  - namespace: env
    keys:
      WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: workday-talent
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/talent
      description: "Workday Talent Management REST API."
      authentication:
        type: bearer
        token: "{{WORKDAY_OAUTH_TOKEN}}"
      resources:
        - name: talent
          path: /
          description: "Talent management operations"
          operations:
            - name: get-talent-profile
              method: GET
              description: "Returns a talent profile for a worker."
              inputParameters:
                - name: worker
                  in: query
                  type: string
                  required: true
                  description: "Worker ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-mentorships
              method: GET
              description: "Returns mentorships."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker-skills
              method: GET
              description: "Returns skills for a worker."
              inputParameters:
                - name: worker
                  in: query
                  type: string
                  required: true
                  description: "Worker ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker-certifications
              method: GET
              description: "Returns certifications for a worker."
              inputParameters:
                - name: worker
                  in: query
                  type: string
                  required: true
                  description: "Worker ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-succession-plans
              method: GET
              description: "Returns succession plans."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-succession-plan-by-id
              method: GET
              description: "Returns a succession plan by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Succession plan ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
  exposes:
    - type: rest
      port: 8111
      namespace: workday-talent-api
      resources:
        - path: /v1/succession-plans
          name: succession
          description: "Succession plan endpoints"
          operations:
            - method: GET
              name: list-succession-plans
              description: "List succession plans"
              call: "workday-talent.get-succession-plans"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9111
      namespace: workday-talent-mcp
      transport: http
      tools:
        - name: get-talent-profile
          description: "Get talent profile for a worker"
          hints:
            readOnly: true
          call: "workday-talent.get-talent-profile"
          with:
            worker: "tools.worker"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-mentorships
          description: "List mentorships"
          hints:
            readOnly: true
          call: "workday-talent.get-mentorships"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-worker-skills
          description: "Get skills for a worker"
          hints:
            readOnly: true
          call: "workday-talent.get-worker-skills"
          with:
            worker: "tools.worker"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-worker-certifications
          description: "Get certifications for a worker"
          hints:
            readOnly: true
          call: "workday-talent.get-worker-certifications"
          with:
            worker: "tools.worker"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-succession-plans
          description: "List succession plans"
          hints:
            readOnly: true
          call: "workday-talent.get-succession-plans"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-succession-plan
          description: "Get a succession plan by ID"
          hints:
            readOnly: true
          call: "workday-talent.get-succession-plan-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
