naftiko: "1.0.0-alpha1"
info:
  label: "Workday Prism Analytics"
  description: "Prism Analytics API for managing datasets, data change tasks, file containers, and tables."
  tags:
    - Workday
    - Analytics
    - Datasets
  created: "2026-04-18"
  modified: "2026-04-18"
binds:
  - namespace: env
    keys:
      WORKDAY_OAUTH_TOKEN: WORKDAY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: workday-prism
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}/prismAnalytics
      description: "Workday Prism Analytics REST API."
      authentication:
        type: bearer
        token: "{{WORKDAY_OAUTH_TOKEN}}"
      resources:
        - name: prism
          path: /
          description: "Prism Analytics operations"
          operations:
            - name: get-datasets
              method: GET
              description: "Returns datasets."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-dataset
              method: POST
              description: "Creates a new dataset."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  fields: "{{tools.fields}}"
            - name: get-dataset-by-id
              method: GET
              description: "Returns a dataset by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Dataset ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-dataset
              method: PUT
              description: "Updates a dataset."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Dataset ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-dataset
              method: DELETE
              description: "Deletes a dataset."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Dataset ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-data-change-tasks
              method: GET
              description: "Returns data change tasks."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-data-change-task
              method: POST
              description: "Creates a data change task."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  targetDataset: "{{tools.targetDataset}}"
            - name: get-tables
              method: GET
              description: "Returns tables."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-table-by-id
              method: GET
              description: "Returns a table by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Table ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-file-container
              method: POST
              description: "Creates a file container for data upload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-file-container-by-id
              method: GET
              description: "Returns a file container by ID."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "File container ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-data-change-task-activities
              method: GET
              description: "Returns activities for a data change task."
              inputParameters:
                - name: ID
                  in: path
                  type: string
                  required: true
                  description: "Data change task ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
  exposes:
    - type: rest
      port: 8113
      namespace: workday-prism-api
      resources:
        - path: /v1/datasets
          name: datasets
          description: "Dataset endpoints"
          operations:
            - method: GET
              name: list-datasets
              description: "List datasets"
              call: "workday-prism.get-datasets"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9113
      namespace: workday-prism-mcp
      transport: http
      tools:
        - name: list-datasets
          description: "List all datasets"
          hints:
            readOnly: true
          call: "workday-prism.get-datasets"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-dataset
          description: "Create a new dataset"
          hints:
            readOnly: false
          call: "workday-prism.create-dataset"
          with:
            name: "tools.name"
            fields: "tools.fields"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-dataset
          description: "Get a dataset by ID"
          hints:
            readOnly: true
          call: "workday-prism.get-dataset-by-id"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-dataset
          description: "Delete a dataset"
          hints:
            readOnly: false
            destructive: true
          call: "workday-prism.delete-dataset"
          with:
            ID: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-data-change-tasks
          description: "List data change tasks"
          hints:
            readOnly: true
          call: "workday-prism.get-data-change-tasks"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-data-change-task
          description: "Create a data change task"
          hints:
            readOnly: false
          call: "workday-prism.create-data-change-task"
          with:
            targetDataset: "tools.targetDataset"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-tables
          description: "List all tables"
          hints:
            readOnly: true
          call: "workday-prism.get-tables"
          outputParameters:
            - type: object
              mapping: "$."
