naftiko: 1.0.0-alpha2
info:
  label: Workday Absence Management API — Leave of Absence
  description: 'Workday Absence Management API — Leave of Absence. 2 operations. Lead operation: Get Leaves of Absence. Self-contained
    Naftiko capability covering one Workday business surface.'
  tags:
  - Workday
  - Leave of Absence
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_API_KEY: WORKDAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: absenceManagement-leave-of-absence
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/absenceManagement/v1/{tenant}
    description: Workday Absence Management API — Leave of Absence business capability. Self-contained, no shared references.
    resources:
    - name: workers-ID-leaveOfAbsences
      path: /workers/{ID}/leaveOfAbsences
      operations:
      - name: getleavesofabsence
        method: GET
        description: Get Leaves of Absence
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: workers-ID-requestLeaveOfAbsence
      path: /workers/{ID}/requestLeaveOfAbsence
      operations:
      - name: requestleaveofabsence
        method: POST
        description: Request Leave of Absence
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.WORKDAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: absenceManagement-leave-of-absence-rest
    port: 8080
    description: REST adapter for Workday Absence Management API — Leave of Absence. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/workers/{id}/leaveofabsences
      name: workers-id-leaveofabsences
      description: REST surface for workers-ID-leaveOfAbsences.
      operations:
      - method: GET
        name: getleavesofabsence
        description: Get Leaves of Absence
        call: absenceManagement-leave-of-absence.getleavesofabsence
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/workers/{id}/requestleaveofabsence
      name: workers-id-requestleaveofabsence
      description: REST surface for workers-ID-requestLeaveOfAbsence.
      operations:
      - method: POST
        name: requestleaveofabsence
        description: Request Leave of Absence
        call: absenceManagement-leave-of-absence.requestleaveofabsence
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: absenceManagement-leave-of-absence-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Absence Management API — Leave of Absence. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-leaves-absence
      description: Get Leaves of Absence
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: absenceManagement-leave-of-absence.getleavesofabsence
      outputParameters:
      - type: object
        mapping: $.
    - name: request-leave-absence
      description: Request Leave of Absence
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: absenceManagement-leave-of-absence.requestleaveofabsence
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
