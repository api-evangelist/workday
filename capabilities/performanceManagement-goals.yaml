naftiko: 1.0.0-alpha2
info:
  label: Workday Performance Management API — Goals
  description: 'Workday Performance Management API — Goals. 1 operations. Lead operation: Get Worker Goals. Self-contained
    Naftiko capability covering one Workday business surface.'
  tags:
  - Workday
  - Goals
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_API_KEY: WORKDAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: performanceManagement-goals
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/performanceManagement/v1/{tenant}
    description: Workday Performance Management API — Goals business capability. Self-contained, no shared references.
    resources:
    - name: workers-ID-goals
      path: /workers/{ID}/goals
      operations:
      - name: getworkergoals
        method: GET
        description: Get Worker Goals
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.WORKDAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: performanceManagement-goals-rest
    port: 8080
    description: REST adapter for Workday Performance Management API — Goals. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/workers/{id}/goals
      name: workers-id-goals
      description: REST surface for workers-ID-goals.
      operations:
      - method: GET
        name: getworkergoals
        description: Get Worker Goals
        call: performanceManagement-goals.getworkergoals
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: performanceManagement-goals-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Performance Management API — Goals. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-worker-goals
      description: Get Worker Goals
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: performanceManagement-goals.getworkergoals
      outputParameters:
      - type: object
        mapping: $.
