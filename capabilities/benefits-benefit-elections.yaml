naftiko: 1.0.0-alpha2
info:
  label: Workday Benefits API — Benefit Elections
  description: 'Workday Benefits API — Benefit Elections. 2 operations. Lead operation: Get Benefit Elections. Self-contained
    Naftiko capability covering one Workday business surface.'
  tags:
  - Workday
  - Benefit Elections
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_API_KEY: WORKDAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: benefits-benefit-elections
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/benefits/v1/{tenant}
    description: Workday Benefits API — Benefit Elections business capability. Self-contained, no shared references.
    resources:
    - name: workers-ID-benefitElections
      path: /workers/{ID}/benefitElections
      operations:
      - name: getbenefitelections
        method: GET
        description: Get Benefit Elections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: workers-ID-changeBenefits
      path: /workers/{ID}/changeBenefits
      operations:
      - name: changebenefits
        method: POST
        description: Change Benefits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.WORKDAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: benefits-benefit-elections-rest
    port: 8080
    description: REST adapter for Workday Benefits API — Benefit Elections. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/workers/{id}/benefitelections
      name: workers-id-benefitelections
      description: REST surface for workers-ID-benefitElections.
      operations:
      - method: GET
        name: getbenefitelections
        description: Get Benefit Elections
        call: benefits-benefit-elections.getbenefitelections
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/workers/{id}/changebenefits
      name: workers-id-changebenefits
      description: REST surface for workers-ID-changeBenefits.
      operations:
      - method: POST
        name: changebenefits
        description: Change Benefits
        call: benefits-benefit-elections.changebenefits
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: benefits-benefit-elections-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Benefits API — Benefit Elections. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-benefit-elections
      description: Get Benefit Elections
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: benefits-benefit-elections.getbenefitelections
      outputParameters:
      - type: object
        mapping: $.
    - name: change-benefits
      description: Change Benefits
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: benefits-benefit-elections.changebenefits
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
